[project]
name = "tddesc-compute"
version = "0.1.0"
description = "V13 isolated compute dependency preparation; production adapters are not implemented yet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libcirkit==0.3.1",
    "cvc5==1.4.2",
    "torch==2.15.0",
]

[project.optional-dependencies]
history = ["aalpy==2.0.0"]

[tool.uv]
package = false
link-mode = "copy"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
