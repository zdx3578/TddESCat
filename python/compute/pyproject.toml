[project]
name = "tddesc-compute"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cvc5==1.4.2"]

[project.optional-dependencies]
circuit = ["libcirkit==0.3.1", "torch==2.15.0"]
history = ["aalpy==2.0.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
