[project]
name = "tddescat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arc-agi==0.9.10",
    "arcengine==0.9.3",
    "jsonschema==4.25.1",
    "referencing==0.37.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
