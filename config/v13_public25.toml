schema_version = 2
run_name = "v13-public25"
run_root = "../runs"

[environment]
base_url = "http://127.0.0.1:0"
competition_mode = false
game_selection = "explicit"
game_id = "ls20-9607627b"
connect_timeout_seconds = 2
request_timeout_seconds = 10

[execution]
max_public_commands = "unlimited"
one_inflight_per_guid = true
post_retry = false
redirect = false
memory_enforcement = "cgroup_v2"
solver_heap_hint_bytes = 1342177280
learning_memory_bytes = 6442450944

[learning]
engine = "../target/release/tddesc-stitch"
policy_file = "stitch.toml"
batch_confirmed_events = 8
background_search = true
sequences = true

[search]
context_radii = [1, 2, 4]
allow_full_frame_context = true
history_lengths = [0, 1, 2, 4]
max_action_coordinates = 512

[planning]
autonomous = true
relation_goals = true

[compute]
factor_kernel = "../target/release/factor-kernel"
solver_python = "../python/compute/.venv/bin/python"
circuit_python = "../python/compute/.venv/bin/python"
